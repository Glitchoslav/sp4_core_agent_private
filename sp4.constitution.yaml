    note: "fetch bez mayEgress; SP4_FIREWALL_URL je env-override, default je loopback"
  - id: "sp4aios_bridge_ask"
    kind: "network"
    file: "SP4AIOS/src/bridge.js"
    symbol: "ask"
    authority: "mayEgress"
    status: "governed"
