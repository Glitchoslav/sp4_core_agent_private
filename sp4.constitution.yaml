# sp4.constitution.yaml
# SP4 Constitution v1 — machine-readable capability/egress manifest.
# Schema: constitution/schema.json. Loader: src/constitution/loader.js.
# Design source: C:\SP4\plans\constitution-v1-plan.md (sekcie 1, 14.5 — DEC-001..DEC-004).
# Autor tohto súboru: kefyk (jediný, kto ho smie meniť).

schema_version: "1.0.0"

metadata:
  title: "SP4 Constitution"
  updated: "2026-07-29"
  authored_by: "kefyk"

git_baseline:
  repo: "https://github.com/Glitchoslav/sp4-workspace.git"
  commit: "50ad8b4998b7c1f459887220a1acc49acec91e54"
  core_agent_commit: "d391f47d3afd2daabd8e91ff13b4cd2dcd60ef21"
  checked_paths:
    - "sp4_core_agent/src/core/actionRegistry.js"
    - "sp4_core_agent/cloudLLM.js"
    - "SP4AIOS/src/bridge.js" # binding C; cesta relatívna k SP4KULT rootu (SP4AIOS je sibling sp4_core_agent, nie nested) — opravené 2026-07-29
  # repo/commit označujú SP4KULT root repo, kde žije SP4AIOS; tento core_agent
  # je samostatný repo identifikovaný cez core_agent_commit.

external_sinks:
  - sink_id: "groq_api"
    host: "api.groq.com"
    known_callers:
      - "sp4_core_agent/cloudLLM.js"
      - "SP4AIOS/src/bridge.js"
    category_allowed: ["conversation_text", "collective_insight"]
    reversibility: "none"
  - sink_id: "litellm_gateway"
    host: "localhost:4000"
    known_callers:
      - "sp4_core_agent/src/llm/litellmClient.js"
    category_allowed: ["conversation_text"]
    reversibility: "none"
    note: "lokalna AI gateway — proxy do DeepSeek/OpenRouter (cloud egress)"
  - sink_id: "openai_api"
    host: "api.openai.com"
    known_callers:
      - "SP4AIOS/src/bridge.js"
    category_allowed: []
    reversibility: "none"
  - sink_id: "anthropic_api"
    host: "api.anthropic.com"
    known_callers:
      - "SP4AIOS/src/bridge.js"
    category_allowed: []
    reversibility: "none"
  - sink_id: "google_ai_api"
    host: "generativelanguage.googleapis.com"
    known_callers:
      - "SP4AIOS/src/bridge.js"
    category_allowed: []
    reversibility: "none"
  - sink_id: "mistral_api"
    host: "api.mistral.ai"
    known_callers:
      - "SP4AIOS/src/bridge.js"
    category_allowed: []
    reversibility: "none"
  - sink_id: "sp4_firewall_local"
    host: "localhost:3003"
    known_callers:
      - "sp4_core_agent/cloudLLM.js"
    category_allowed: ["conversation_text_preview"]
    reversibility: "n/a"
    note: "poradný routing-consult, nie AI provider; nie skutočný egress (localhost)"

