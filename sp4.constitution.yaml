  - id: "sp4aios_bridge_providers_direct"
    kind: "network"
    file: "SP4AIOS/src/bridge.js"
    symbol: "providers[x].complete (verejný prístup)"
    authority: null
    status: "removed"
    evidence: "none"
    note: "odstránené 2026-08-15 — LiteLLM canonical; sibling SP4AIOS/src/bridge.js je compatibility shim (odstráni sa pri deployi)"
  - id: "sp4_core_agent_bridge_legacy"
    kind: "network"
    file: "SP4AIOSBridge.js"
    symbol: "OpenAIProvider/AnthropicProvider/atď complete()"
    authority: null
    status: "removed"
    evidence: "none"
    note: "zmazaný 2026-08-15 (LiteLLM canonical egress); importer examples/aios_examples.js tiež odstránený"
  - id: "action_router_execute"
    kind: "process"
    file: "src/core/actionRouter.js"
    symbol: "executeAction"
    authority: null
    status: "known_gap"
    evidence: "none"
    note: "exportovaná, validateAction() volá can() ale executeAction() samotná nie; dosiahnuteľné priamym importom"
  - id: "open_url_shell_exec"
