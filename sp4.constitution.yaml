    status: "governed"
    evidence: "weak"
    note: "textová blízkosť gate->fetch, nie AST dôkaz"
  - id: "firewall_consult"
    kind: "network"
    file: "cloudLLM.js"
    symbol: "consultFirewall"
    authority: null
    status: "known_gap"
