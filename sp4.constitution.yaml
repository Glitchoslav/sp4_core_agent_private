    symbol: "executeOpenUrl"
    authority: null
    status: "known_gap"
    evidence: "none"
    note: "gate:never na OPEN_URL v action_capabilities znamená, že kód sa dnes nevykoná - ale samotná funkcia can() nekontroluje"
  - id: "bridge_server_member_purge"
    kind: "network"
    file: "bridge-server.js"
    symbol: "POST /api/member/purge"
    authority: null
    status: "known_gap"
    evidence: "none"
